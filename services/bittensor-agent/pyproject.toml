[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-bittensor-agent"
version = "0.1.0"
description = "Owner-local typed Bittensor identity service for Beam Orchestrators and Workers"
requires-python = ">=3.10"
dependencies = ["bittensor>=10.3.1,<11.0.0"]

[project.scripts]
beam-bittensor-agent = "beam_bittensor_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
